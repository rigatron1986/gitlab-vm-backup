# NAS
NAS_BACKUP_DIR="/mnt/sources/nas/backup/gitlab"

# CIFS mount for NAS_BACKUP_DIR. Used by ensure_nas_mount() (lib/common.sh),
# called from install.sh/restore.sh/mount-nas.sh so a fresh VM can mount the
# NAS itself instead of relying on a hand-set-up fstab entry.
NAS_HOST="192.168.1.120"
NAS_SHARE="Backup/Gitlab"

CIFS_CREDENTIALS_FILE="/root/.smbcredentials"
CIFS_UID=1000
CIFS_GID=1000
CIFS_VERS="3.0"
CIFS_FILE_MODE="0664"
CIFS_DIR_MODE="0775"

# Runtime directories
BACKUP_ROOT="/mnt/shared/backup/gitlab"

LOCAL_BACKUP_DIR="${BACKUP_ROOT}/local"
TEMP_BACKUP_DIR="${BACKUP_ROOT}/temp"

# Logs live on the NAS share (not BACKUP_ROOT) so history survives
# independently of local disk / whatever's mounted at BACKUP_ROOT.
LOG_DIR="${NAS_BACKUP_DIR}/logs"

# GitLab
GITLAB_BACKUP_DIR="/var/opt/gitlab/backups"

# Used only by install.sh on a fresh VM, for the first-time package install
# before the backup's gitlab.rb gets restored over it and reconfigure runs
# again with the real settings.
GITLAB_EXTERNAL_URL="http://localhost"

# Retention
RETENTION_DAYS=5

WAIT_RETRIES=40
WAIT_INTERVAL=15
